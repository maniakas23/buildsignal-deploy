<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- ==================================================================== -->
    <!--  ANALYTICS — Custom local-first with GA4 upgrade path        -->
    <!--  Current mode: local-only (logs to console + localStorage)     -->
    <!--  To enable GA1: set ANALYTICS_ID = "ga4-GA_MEASUREMENT_ID"   -->
    <!--  in src/hooks/usePageTracking.ts and add the gtag script     -->
    <!--  below.                                                      -->
    <!-- ==================================================================== -->
    <!-- GA4 script placeholder — uncomment when ready:
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GA_MEASUREMENT_ID');
    </script>
    -->

    <!-- Title & Description -->
    <title>BuildSignal — Development Intelligence from Government Sources</title>
    <meta name="description" content="BuildSignal monitors authoritative public development sources — permits, zoning, and planning activity — connects related records into development timelines, and surfaces opportunities early, with the government evidence attached." />
    <meta name="keywords" content="development intelligence, building permits, zoning activity, commercial real estate, site selection, permit tracking, construction activity, development timelines" />
    <meta name="author" content="BuildSignal" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://buildsignal.net/" />
    <link rel="alternate" hreflang="en" href="https://buildsignal.net/" />
    <link rel="alternate" hreflang="x-default" href="https://buildsignal.net/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#081018" />
    <meta name="msapplication-TileColor" content="#081018" />

    <!-- Mobile & App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BuildSignal" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://buildsignal.net/" />
    <meta property="og:title" content="BuildSignal — Development Intelligence from Government Sources" />
    <meta property="og:description" content="Authoritative development activity — permits, zoning, planning — organized into timelines, surfaced early, with the government evidence attached." />
    <meta property="og:image" content="https://buildsignal.net/og-image.svg" />
    <meta property="og:site_name" content="BuildSignal" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://buildsignal.net/" />
    <meta name="twitter:title" content="BuildSignal — Development Intelligence from Government Sources" />
    <meta name="twitter:description" content="Authoritative development activity organized into timelines and surfaced early, with the government evidence attached." />
    <meta name="twitter:image" content="https://buildsignal.net/og-image.svg" />

    <!-- JSON,PLD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BuildSignal",
      "url": "https://buildsignal.net",
      "logo": "https://buildsignal.net/favicon.svg",
      "description": "Development intelligence platform that monitors authoritative public sources — permits, zoning, and planning activity — and organizes them into development timelines with source evidence.",
      "sameAs": [
        "https://twitter.com/buildsignal",
        "https://linkedin.com/company/buildsignal"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@buildsignal.net",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- JSON.CLD Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BuildSignal",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Development intelligence platform built on authoritative public records, with lifecycle timelines and source evidence.",
      "offers": [
        {
          "@type": "Offer",
          "name": "Scout",
          "description": "Essential intelligence for individual professionals and small teams",
          "price": "99",
          "priceCurrency": "USD",
          "priceValidUntil": "2026-12-31"
        },
        {
          "@type": "Offer",
          "name": "Professional",
          "description": "Development timelines, Detection Advantage lead-time metrics, and API access for growing teams",
          "price": "249",
          "priceCurrency": "USD",
          "priceValidUntil": "2026-12-31"
        },
        {
          "@type": "Offer",
          "name": "Business",
          "description": "Full-scale intelligence for organizations with multiple markets",
          "price": "599",
          "priceCurrency": "USD",
          "priceValidUntil": "2026-12-31"
        },
        {
          "@type": "Offer",
          "name": "Enterprise",
          "description": "Custom intelligence solutions for large organizations with dedicated support",
          "price": "0",
          "priceCurrency": "USD"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
