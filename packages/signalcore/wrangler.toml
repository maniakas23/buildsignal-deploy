# Kestovar Engine — Cloudflare Worker
# Deployed to: api.buildsignal.net (Service Binding from Pages)
# Deploy: cd packages/signalcore && npx wrangler deploy
name = "kestovar-engine"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "buildsignal-db"
database_id = "a8ecb143-6aa6-4741-b4e8-fe3e16695452"

[vars]
ENGINE_NAME = "kestovar"
NODE_ENV = "production"

[env.preview]
name = "kestovar-engine-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "buildsignal-db-preview"
database_id = "a8ecb143-6aa6-4741-b4e8-fe3e16695452"
